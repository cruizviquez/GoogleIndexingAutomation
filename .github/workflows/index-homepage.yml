name: Index Homepage

on:
  workflow_dispatch:

jobs:
  index-homepage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Create service account file
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > service-account-key.json

      - name: Submit homepage to Google
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account-key.json
          TARGET_URL: "https://www.eviazoom.gr/"
        run: python scripts/index_single_url.py
